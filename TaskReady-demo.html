<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskReady AI — превращает бизнес-идеи в готовые задачи для студенческих команд." />
  <title>TaskReady AI — готовность задач</title>
  <style>:root {
  --ink: #17212b;
  --muted: #75808c;
  --line: #e8edf2;
  --canvas: #f6f8fb;
  --surface: #ffffff;
  --navy: #18324c;
  --blue: #2f7de1;
  --blue-soft: #eaf2ff;
  --cyan: #2db9c4;
  --green: #35a879;
  --green-soft: #e9f8f0;
  --orange: #e9964a;
  --orange-soft: #fff3e6;
  --red: #d96364;
  --red-soft: #fceded;
  --purple: #8165d7;
  --purple-soft: #f0edff;
  --shadow: 0 12px 32px rgba(24, 50, 76, .07);
  --radius: 16px;
  --radius-sm: 10px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--canvas);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; display: flex; }
.sidebar { width: 248px; background: var(--navy); color: #d7e2ed; padding: 24px 16px; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 4; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 12px 30px; color: white; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, #61d5d8, #4c7ee9); display: grid; place-items: center; color: white; font-size: 20px; box-shadow: 0 6px 16px rgba(76,126,233,.3); }
.brand strong { font-size: 17px; letter-spacing: -.3px; }
.brand small { display: block; color: #89a2b9; font-size: 10px; margin-top: 2px; letter-spacing: .8px; text-transform: uppercase; }
.nav { display: grid; gap: 5px; }
.nav button { border: 0; background: transparent; color: #a9bdcf; text-align: left; border-radius: 10px; padding: 12px 13px; display: flex; align-items: center; gap: 11px; font-size: 14px; transition: .2s ease; }
.nav button:hover { background: rgba(255,255,255,.08); color: white; }
.nav button.active { background: #2e506f; color: white; box-shadow: inset 3px 0 0 #63d1d5; }
.nav-icon { width: 19px; text-align: center; font-size: 17px; }
.sidebar-bottom { margin-top: auto; }
.demo-note { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 13px; font-size: 12px; line-height: 1.45; color: #b9cad9; }
.demo-note strong { display: block; color: #eaf3fa; margin-bottom: 5px; }
.main { margin-left: 248px; width: calc(100% - 248px); min-height: 100vh; }
.topbar { height: 76px; padding: 0 34px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(246,248,251,.9); position: sticky; top: 0; z-index: 3; backdrop-filter: blur(12px); }
.breadcrumb { color: var(--muted); font-size: 13px; }
.breadcrumb strong { color: var(--ink); font-size: 14px; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.role-switch { background: #e9eef3; padding: 3px; border-radius: 10px; display: flex; }
.role-switch button { border: 0; padding: 7px 10px; border-radius: 8px; color: var(--muted); background: transparent; font-size: 12px; }
.role-switch button.active { color: var(--navy); background: white; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 700; }
.avatar { width: 35px; height: 35px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; border-radius: 50%; font-weight: 700; font-size: 13px; }
.content { padding: 31px 34px 56px; max-width: 1480px; }
.page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 25px; }
.page-heading h1 { margin: 0 0 7px; letter-spacing: -1px; font-size: 29px; color: var(--navy); }
.page-heading p { margin: 0; color: var(--muted); font-size: 14px; }
.heading-actions { display: flex; gap: 9px; }
.btn { border: 1px solid var(--line); color: var(--navy); background: white; border-radius: 9px; padding: 10px 14px; font-weight: 650; font-size: 13px; transition: .2s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(24,50,76,.08); }
.btn.primary { border-color: var(--blue); background: var(--blue); color: white; }
.btn.primary:hover { background: #276dc4; }
.btn.soft { border-color: transparent; color: var(--blue); background: var(--blue-soft); }
.btn.danger { color: var(--red); background: var(--red-soft); border-color: transparent; }
.btn.success { color: #23855c; background: var(--green-soft); border-color: transparent; }
.btn.small { padding: 7px 10px; font-size: 12px; }
.grid { display: grid; gap: 18px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.metric { padding: 20px; min-height: 125px; position: relative; overflow: hidden; }
.metric::after { content: ""; position: absolute; right: 0; top: -22px; width: 88px; height: 88px; border-radius: 50%; background: var(--blue-soft); opacity: .7; pointer-events: none; }
.metric .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .15px; text-transform: uppercase; position: relative; z-index: 1; max-width: calc(100% - 12px); overflow-wrap: anywhere; }
.metric .value { color: var(--navy); font-size: 32px; letter-spacing: -1px; font-weight: 760; margin: 10px 0 4px; position: relative; z-index: 1; }
.metric .detail { color: var(--muted); font-size: 12px; position: relative; z-index: 1; }
.hero-card { padding: 24px; background: linear-gradient(125deg, #17344f 0%, #214c6f 58%, #257e8c 100%); color: white; min-height: 272px; position: relative; overflow: hidden; }
.hero-card::after { content: ""; position: absolute; width: 420px; height: 420px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; right: 0; top: -190px; box-shadow: 0 0 0 32px rgba(255,255,255,.03), 0 0 0 64px rgba(255,255,255,.03); pointer-events: none; }
.hero-card h2 { margin: 0 0 10px; font-size: 21px; letter-spacing: -.4px; position: relative; z-index: 1; }
.hero-card p { color: #bad0df; max-width: 520px; font-size: 13px; line-height: 1.5; position: relative; z-index: 1; }
.hero-bottom { display: flex; gap: 24px; align-items: center; margin-top: 20px; position: relative; z-index: 1; }
.score-ring { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#63d1d5 0 78%, rgba(255,255,255,.17) 78% 100%); position: relative; flex: 0 0 auto; }
.score-ring::after { content: ""; position: absolute; inset: 9px; background: #1d4663; border-radius: 50%; }
.score-ring .score-in { z-index: 1; text-align: center; }
.score-ring strong { display: block; font-size: 29px; line-height: 1; }
.score-ring span { color: #b9d1dc; font-size: 10px; }
.hero-points { display: grid; gap: 10px; }
.hero-point { display: flex; gap: 9px; align-items: center; font-size: 12px; color: #d2e5ec; }
.hero-point b { width: 22px; height: 22px; display: grid; place-items: center; color: #13314c; background: #81e0db; border-radius: 7px; }
.section-card { padding: 21px; }
.section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 17px; }
.section-title h3 { margin: 0; color: var(--navy); font-size: 16px; letter-spacing: -.2px; }
.section-title span { color: var(--muted); font-size: 12px; }
.readiness-list { display: grid; gap: 14px; }
.readiness-row { display: grid; grid-template-columns: 145px 1fr 42px; gap: 12px; align-items: center; font-size: 12px; }
.readiness-row label { color: #4a5967; }
.progress { height: 8px; background: #edf1f4; border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
.readiness-row strong { color: var(--navy); text-align: right; font-size: 12px; }
.insight { border: 1px solid #f4dfc7; background: #fffaf4; border-radius: 12px; padding: 14px; display: flex; gap: 11px; align-items: flex-start; }
.insight-icon { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: var(--orange-soft); display: grid; place-items: center; }
.insight strong { display: block; font-size: 13px; color: #794c20; margin-bottom: 4px; }
.insight p { margin: 0; color: #896d50; font-size: 12px; line-height: 1.45; }
.task-card { padding: 18px; transition: .2s ease; }
.task-card:hover { border-color: #c9dcf1; transform: translateY(-2px); }
.task-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.task-card h3 { margin: 0 0 7px; font-size: 15px; color: var(--navy); line-height: 1.35; }
.task-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 5px 7px; font-size: 10px; font-weight: 750; white-space: nowrap; }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.badge.green { background: var(--green-soft); color: #27855e; }
.badge.orange { background: var(--orange-soft); color: #b66b23; }
.badge.purple { background: var(--purple-soft); color: var(--purple); }
.badge.gray { background: #f0f2f4; color: #68747f; }
.task-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; color: var(--muted); font-size: 11px; }
.task-meta span { background: #f7f8fa; border-radius: 6px; padding: 5px 7px; }
.task-score { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.task-score .progress { flex: 1; height: 6px; }
.task-score strong { color: var(--navy); font-size: 13px; }
.catalog-toolbar { display: flex; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 9px; padding: 11px 12px; outline: none; transition: .2s ease; }
.input:focus, .select:focus, .textarea:focus { border-color: #9bc0ef; box-shadow: 0 0 0 3px var(--blue-soft); }
.textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
.catalog-toolbar .input { max-width: 310px; }
.catalog-toolbar .select { max-width: 180px; }
.field { display: grid; gap: 7px; }
.field label { font-weight: 700; font-size: 12px; color: #455462; }
.field label span { color: var(--muted); font-weight: 500; }
.form-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(290px, .7fr); gap: 18px; align-items: start; }
.form-card { padding: 22px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.form-grid .full { grid-column: 1 / -1; }
.ai-banner { border: 1px solid #cde9eb; background: linear-gradient(90deg, #effafa, #f7fbff); border-radius: 12px; padding: 14px; display: flex; gap: 11px; margin-bottom: 18px; }
.ai-orb { width: 31px; height: 31px; background: linear-gradient(135deg, #42c6c8, #597ee9); color: white; display: grid; place-items: center; border-radius: 10px; flex: 0 0 auto; }
.ai-banner strong { display: block; color: #1d6970; font-size: 13px; margin-bottom: 4px; }
.ai-banner p { margin: 0; color: #637c84; font-size: 12px; line-height: 1.45; }
.questions { display: grid; gap: 10px; margin-top: 14px; }
.question { background: white; border: 1px solid #dceff0; padding: 12px; border-radius: 10px; }
.question .q-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.question strong { font-size: 12px; color: var(--navy); }
.question small { color: var(--muted); font-size: 10px; }
.question p { margin: 8px 0 0; font-size: 12px; color: #5b6e79; line-height: 1.45; }
.stepper { display: flex; gap: 6px; margin-bottom: 21px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; color: #91a0ae; font-size: 12px; white-space: nowrap; }
.step:not(:last-child)::after { content: "→"; color: #c6cfd7; margin-left: 4px; }
.step .num { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: #e8edf1; font-size: 11px; font-weight: 800; }
.step.active { color: var(--blue); font-weight: 700; }
.step.active .num { background: var(--blue); color: white; }
.step.done { color: var(--green); }
.step.done .num { background: var(--green-soft); color: var(--green); }
.score-panel { padding: 22px; position: sticky; top: 98px; }
.score-panel .score-big { display: flex; align-items: center; gap: 14px; margin-bottom: 17px; }
.score-number { font-size: 46px; color: var(--navy); letter-spacing: -2px; font-weight: 800; line-height: 1; }
.score-caption { color: var(--muted); font-size: 11px; }
.score-caption strong { display: block; font-size: 13px; color: var(--green); margin-bottom: 5px; }
.breakdown { display: grid; gap: 11px; border-top: 1px solid var(--line); padding-top: 15px; }
.breakdown-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; font-size: 11px; }
.breakdown-row .label { display: flex; justify-content: space-between; color: #5c6975; margin-bottom: 5px; }
.breakdown-row .label b { color: var(--navy); }
.missing { margin-top: 16px; border-radius: 10px; background: #fff9ee; padding: 12px; }
.missing h4 { color: #9b6729; font-size: 12px; margin: 0 0 7px; }
.missing ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.missing li { font-size: 11px; color: #91714c; display: flex; gap: 6px; }
.missing li::before { content: "＋"; color: var(--orange); font-weight: 800; }
.publish-check { display: flex; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 15px 0; font-size: 12px; color: #5b6875; line-height: 1.45; }
.publish-check input { accent-color: var(--blue); width: 16px; height: 16px; margin-top: 1px; }
.toolbar-line { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 17px; }
.toolbar-line h2 { margin: 0; color: var(--navy); font-size: 19px; }
.toolbar-line p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); }
.empty .empty-icon { font-size: 30px; margin-bottom: 10px; }
.offer-card { padding: 18px; }
.offer-top { display: flex; justify-content: space-between; gap: 10px; }
.team-name { display: flex; gap: 10px; align-items: center; }
.team-avatar { width: 34px; height: 34px; background: var(--purple-soft); color: var(--purple); display: grid; place-items: center; border-radius: 10px; font-weight: 800; font-size: 12px; }
.offer-card h3 { margin: 0 0 3px; font-size: 14px; color: var(--navy); }
.offer-card p { margin: 0; color: var(--muted); font-size: 11px; }
.offer-body { margin: 14px 0; padding: 12px; background: #fafbfc; border-radius: 10px; color: #566672; font-size: 12px; line-height: 1.5; }
.offer-actions { display: flex; justify-content: flex-end; gap: 7px; }
.compare-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.compare-cell { border: 1px solid var(--line); border-radius: 11px; padding: 13px; }
.compare-cell strong { color: var(--navy); display: block; font-size: 12px; margin-bottom: 7px; }
.compare-cell p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
.kpi-strip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 2px; }
.kpi { flex: 1; min-width: 130px; background: #f8fafc; border: 1px solid var(--line); border-radius: 11px; padding: 13px; }
.kpi strong { display: block; font-size: 21px; color: var(--navy); }
.kpi span { color: var(--muted); font-size: 11px; }
.journey { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 14px 0 8px; }
.journey-step { min-width: 105px; text-align: center; position: relative; }
.journey-step:not(:last-child)::after { content: ""; height: 2px; background: #d9e6ee; width: 58px; position: absolute; top: 18px; left: calc(50% + 20px); }
.journey-dot { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; margin: 0 auto 8px; background: var(--blue-soft); color: var(--blue); font-weight: 800; font-size: 12px; position: relative; z-index: 1; }
.journey-step strong { display: block; font-size: 11px; color: var(--navy); }
.journey-step span { color: var(--muted); font-size: 10px; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(17,32,48,.45); z-index: 10; display: grid; place-items: center; padding: 20px; }
.modal { background: white; width: min(720px, 100%); max-height: min(760px, 90vh); overflow-y: auto; border-radius: 18px; box-shadow: 0 24px 80px rgba(15,35,55,.25); padding: 23px; }
.modal-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.modal-head h2 { color: var(--navy); font-size: 20px; margin: 0 0 6px; }
.modal-head p { color: var(--muted); font-size: 12px; margin: 0; }
.close { border: 0; background: #f0f3f6; border-radius: 8px; width: 30px; height: 30px; color: var(--muted); font-size: 18px; }
.modal-section { margin-top: 18px; }
.modal-section h4 { color: var(--navy); margin: 0 0 9px; font-size: 13px; }
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.detail-item { background: #f8fafb; border-radius: 9px; padding: 10px; }
.detail-item span { display: block; color: var(--muted); font-size: 10px; margin-bottom: 4px; }
.detail-item b { display: block; color: #4e5e6a; font-size: 12px; line-height: 1.4; font-weight: 600; }
.toast-root { position: fixed; right: 22px; bottom: 22px; z-index: 30; display: grid; gap: 8px; }
.toast { background: #16344f; color: white; border-radius: 10px; padding: 12px 15px; box-shadow: 0 8px 24px rgba(10,30,50,.2); font-size: 12px; animation: toast-in .25s ease; max-width: 320px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 1050px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .form-layout { grid-template-columns: 1fr; } .score-panel { position: static; } }
@media (max-width: 760px) { .sidebar { width: 72px; padding: 18px 10px; } .brand { padding: 0 9px 26px; } .brand > div:last-child, .nav button span:not(.nav-icon), .demo-note { display: none; } .nav button { justify-content: center; padding: 12px 8px; } .main { margin-left: 72px; width: calc(100% - 72px); } .topbar { padding: 0 17px; } .content { padding: 24px 17px 44px; } .top-actions .role-switch { display: none; } .grid-3, .grid-2, .grid-4 { grid-template-columns: 1fr; } .page-heading { display: block; } .heading-actions { margin-top: 16px; } .form-grid { grid-template-columns: 1fr; } .form-grid .full { grid-column: auto; } .compare-grid, .detail-grid { grid-template-columns: 1fr; } .readiness-row { grid-template-columns: 110px 1fr 34px; } }

/* TaskReady — calm editorial workspace */

function calculate(card){
 const breakdown=Object.entries(RUBRIC.fields).map(([key,s])=>{
  const text=String(card[key]||'').trim(); const words=text.toLowerCase().match(/[\p{L}\p{N}_]+/gu)||[];
  const valid=new Set(words).size>=3&&!/^(не знаю|не определен[ыоа]?|уточняется|пока неизвестно|нет|потом|tbd|n\/?a)[.!\s]*$/i.test(text);
  const checks=s.checks.map(c=>({...c,passed:valid&&new RegExp(c.pattern,'i').test(text)}));
  const points=Math.round(s.weight*checks.filter(c=>c.passed).length/checks.length);
  return {key,label:s.label,weight:s.weight,points,checks,reason:checks.filter(c=>!c.passed).map(c=>c.label).join('; ')||'Оба признака конкретности найдены'};
 });const score=breakdown.reduce((a,b)=>a+b.points,0);return {score,level:levelFor(score),breakdown};
}

 const offer=state.offers.find(o=>o.id===id);if(!offer)return;const task=state.tasks.find(t=>t.id===offer.taskId);if(state.role!=='business'||task?.owner!==currentIdentity().id){toast('Решение доступно только владельцу задачи.');return;}
 if(action==='progress'){if(offer.progressConfirmed)return;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="progress-title"><div class="modal-head"><h2 id="progress-title">Подтвердить результат</h2><button class="close" data-close aria-label="Закрыть">×</button></div><p>Зафиксируйте, что вы проверили. За этот этап команда получит 10 баллов один раз.</p><form id="progress-form"><label>Что сделано<textarea id="progress-evidence" class="textarea" required minlength="10" maxlength="2000" placeholder="Например: проверили импорт на 20 тестовых заявках"></textarea></label><button class="btn primary" id="confirm-progress">Подтвердить</button></form></div></div>`;bindModal();document.getElementById('progress-form').onsubmit=e=>{e.preventDefault();confirmProgress(id)};return;}
 await busy(`[data-offer="${id}"][data-decision="${action}"]`,async()=>{const status=action==='accept'?'accepted':'rejected';if(DEMO){if(offer.status===status)return;if(offer.status!=='pending')throw Error('Решение уже принято.');offer.status=status;if(status==='accepted')state.teams.find(t=>t.id===offer.teamId).points+=5;saveState();}else{await api('/offers/'+id+'/decision','POST',{decision:status});await syncState();}render();toast(status==='accepted'?'Команда выбрана. Начислено 5 баллов за старт.':'Отклик отклонён.');});
}
async function confirmProgress(id){await busy('#confirm-progress',async()=>{const evidence=document.getElementById('progress-evidence').value.trim();if(evidence.length<10)throw Error('Опишите проверенный результат.');if(DEMO){const o=state.offers.find(o=>o.id===id);if(!o.progressConfirmed){o.progressConfirmed=true;o.progressEvidence=evidence;state.teams.find(t=>t.id===o.teamId).points+=10;saveState();}}else{await api('/offers/'+id+'/progress','POST',{evidence});await syncState();}closeModal();render();toast('Прогресс подтверждён.');});}
async function exportData(){try{const data=DEMO?{tasks:state.tasks,teams:state.teams,offers:visibleOffers()}:await api('/export');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='taskready-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){toast(e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
bootstrapServer();
</script>
